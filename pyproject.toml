[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "sqlite-utils>=3.36",
    "httpx>=0.27",
    "anthropic>=0.28",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "twikit>=2.3",
    "youtube-transcript-api>=1.2,<2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3"]

[project.scripts]
orbit = "orbit.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["orbit*"]
